[package]
name = "bevy_game" # ToDo
version = "0.1.0"
publish = false
authors = ["Taishi <alexandra.2002.mikh@gmail.com>"]
edition = "2024"
exclude = ["dist", "build", "assets", "credits"]

[workspace]
members = ["mobile"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
# xbuild also uses this profile for building android AABs because I couldn't find a configuration for it
[profile.release]


# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Profile for distribution
[profile.wasm-dist]
inherits = "dist"
strip = false

[features]
dev = [
    "bevy/bevy_remote",
    "bevy/dynamic_linking",
    "bevy/debug"
]

# Bevy's default features are `2d`, `3d`, `ui` and `audio`. We take all of them except for `audio`, since it clashes with bevy_kira_audio.
# If your game doesn't need 3d (or 2d), dropping that collection here will cut down on compile times.
[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "2d",
    "ui",    
    "picking",
    "bevy_feathers",
] }
bevy_kira_audio = { version = "0.27.1" }
bevy_asset_loader = { version = "0.28.1" }
rand = { version = "0.10.3" }
webbrowser = { version = "1", features = ["hardened"] }

# keep the following in sync with Bevy's dependencies
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
## This greatly improves WGPU's performance due to its heavy use of trace! calls
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
avian2d = {version = "0.8.0", features = ["default-collider"]}
vleue_navigator = { version = "0.17.0", features = ["avian2d"]}
bevy-inspector-egui = "0.38.0"
bevy_egui = "0.43.1"

# Required to make `rand`/`getrandom` work on wasm.
# Backend is selected via `.cargo/config.toml` rustflags for the wasm32-unknown-unknown target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[build-dependencies]
embed-resource = "1"
